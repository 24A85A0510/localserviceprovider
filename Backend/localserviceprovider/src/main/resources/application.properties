# ==========================================

# Database Connection Settings (Aiven MySQL)

# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/localserviceprovider?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Mahesh510@}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# JPA / Hibernate Configuration

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect



# ==========================================

# JWT Configuration

# ==========================================

jwt.secret=${JWT_SECRET:YOUR_JWT_SECRET}

jwt.expiration=86400000



# ==========================================

# Swagger / OpenAPI 3 Configuration

# ==========================================

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operationsSorter=method

springdoc.swagger-ui.tagsSorter=alpha

springdoc.api-docs.path=/v3/api-docs



# ==========================================

# Debug Logging Configuration

# ==========================================

logging.level.org.springframework.web=DEBUG

logging.level.org.springframework.security=DEBUG



# ==========================================

# OAuth2 Social Login Configuration

# ==========================================



# Google OAuth2 Credentials

spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}

spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=email,profile



# GitHub OAuth2 Credentials

spring.security.oauth2.client.registration.github.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID:YOUR_GITHUB_CLIENT_ID}

spring.security.oauth2.client.registration.github.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET:YOUR_GITHUB_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.scope=user:email,read:user